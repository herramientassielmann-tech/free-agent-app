{# Barra del editor. Se reutiliza en el generador, el historial y las ideas. #}
<div class="card ed-toolbar ed-no-print">
  <span class="ed-editable-pista">✏️ Escribe encima para adaptarlo</span>

  <div class="ed-tools">
    <button type="button" class="ed-tool" data-cmd="bold" title="Negrita (⌘B)"><b>B</b></button>
    <button type="button" class="ed-tool" data-cmd="italic" title="Cursiva (⌘I)"><i>I</i></button>
    <button type="button" class="ed-tool" data-cmd="insertUnorderedList" title="Lista">≡</button>
    {% if url_restaurar is defined and url_restaurar %}
    <span class="ed-sep"></span>
    <button type="button" class="ed-tool ed-tool--wide" data-ed-restaurar title="Volver al guión original">↺<span class="solo-ancho"> Restaurar</span></button>
    {% endif %}
  </div>

  <div class="ed-right">
    <span class="ed-estado" data-ed-estado="{{ 'editado' if editado else 'listo' }}">
      {% if editado %}Guardado ✓
      {%- else %}Editable<span class="solo-ancho"> — escribe encima</span>{% endif %}
    </span>
    <button type="button" class="btn btn-ghost btn-sm" data-ed-copiar>📋<span class="solo-ancho"> Copiar</span></button>
    <button type="button" class="btn btn-primary btn-sm" data-ed-pdf>📄<span class="solo-ancho"> Descargar</span> PDF</button>
  </div>
</div>
