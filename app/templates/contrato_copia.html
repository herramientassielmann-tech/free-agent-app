<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contrato firmado · FA Academy</title>
<link rel="icon" href="/static/marca/favicon.svg" type="image/svg+xml">
<style>
  /* La barra de arriba es lo único que añade esta página. Lo de debajo es el
     documento tal cual se firmó, byte a byte, para que su huella siga
     cuadrando con la que tiene el alumno en el correo. */
  body { margin: 0; background: #EEF2F6; }
  .barra {
    position: sticky; top: 0; z-index: 5; background: #16202C; color: #fff;
    font: 500 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 12px 18px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .barra b { font-weight: 600; }
  .barra button {
    font: inherit; font-weight: 600; background: #0A6FD4; color: #fff; border: 0;
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
  }
  .papel { max-width: 860px; margin: 24px auto 48px; padding: 0 12px; }
  @media print { .barra { display: none; } .papel { margin: 0; padding: 0; } body { background: #fff; } }
</style>
</head>
<body>
  <div class="barra">
    <span><b>Contrato firmado</b> por {{ firma.nombre_firmante }} el
      {{ firma.firmado_en.strftime('%d/%m/%Y') }}</span>
    <button type="button" onclick="window.print()">Guardar en PDF</button>
  </div>
  <div class="papel">{{ firma.html_firmado | safe }}</div>
</body>
</html>
