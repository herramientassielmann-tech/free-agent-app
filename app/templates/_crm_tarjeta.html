{# Una tarjeta del tablero. `l` es el lead ya serializado por el router. #}
<article class="crm-tarjeta crm-urg--{{ l.urgencia }}" data-id="{{ l.id }}">
  <b class="crm-nombre">{{ l.nombre }}</b>
  {% if l.interes %}<span class="crm-interes">{{ l.interes }}</span>{% endif %}
  <div class="crm-pie">
    {% if l.origen %}<span class="crm-origen">{{ l.origen }}</span>{% endif %}
    {% if l.presupuesto %}<span class="crm-presupuesto">{{ l.presupuesto }}</span>{% endif %}
    <span class="crm-dias" title="Días desde el último contacto">{{ l.dias }}d</span>
  </div>
</article>
