<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bienvenido a Free Agent Academy</title>
  <!-- La marca. El SVG cambia de color solo según el tema del navegador; los PNG
     son el respaldo para los clientes que no leen favicons en SVG. -->
  <link rel="icon" href="/static/marca/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/static/marca/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/static/marca/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Página pública: no hereda nada de la app, así que se viste sola.
     Se compromete con el modo claro a propósito — es una página de pago y de
     firma, y aquí la previsibilidad vale más que adaptarse al tema del sistema. */
  :root {
    --tinta:#16202C; --suave:#495765; --tenue:#6B7A88;
    --lienzo:#F1F4F8; --papel:#FFFFFF; --filete:#E1E7ED;
    --azul:#0A6FD4; --azul-osc:#0A5DB0;
    --verde:#1E7F4B; --verde-luz:#E8F5EE;
    --ambar:#9A5B00; --ambar-luz:#FDF3E2; --rojo:#B3261E; --rojo-luz:#FDEDEC;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--lienzo); color:var(--tinta);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .envoltura { max-width:640px; margin:0 auto; padding:48px 20px 72px; }
  @media (max-width:640px){ .envoltura{ padding:28px 16px 48px; } }

  .marca { font-size:.78rem; font-weight:700; letter-spacing:.14em;
           text-transform:uppercase; color:var(--tenue); }
  h1 { font-size:1.85rem; font-weight:700; line-height:1.22; margin:.6rem 0 .5rem;
       text-wrap:balance; }
  .entradilla { color:var(--suave); margin:0 0 2rem; font-size:1.02rem; }

  .paso {
    background:var(--papel); border:1px solid var(--filete); border-radius:14px;
    padding:20px 22px; margin-bottom:14px;
    display:grid; grid-template-columns:34px 1fr; gap:0 16px; align-items:start;
  }
  .paso--hecho { border-color:#BFE3CE; background:#FBFEFC; }
  .paso--bloqueado { opacity:.62; }

  .num {
    width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
    font-size:.86rem; font-weight:700; background:var(--lienzo); color:var(--suave);
    grid-row:span 2;
  }
  .paso--hecho .num { background:var(--verde); color:#fff; }
  .paso h2 { font-size:1.04rem; font-weight:600; margin:3px 0 2px; }
  .paso p { margin:0 0 .9rem; color:var(--suave); font-size:.94rem; }
  .paso p:last-child { margin-bottom:0; }

  .estado { font-size:.78rem; font-weight:600; padding:3px 10px; border-radius:20px;
            display:inline-block; margin-top:.5rem; }
  .estado--ok { background:var(--verde-luz); color:var(--verde); }
  .estado--esp { background:var(--ambar-luz); color:var(--ambar); }

  .btn {
    display:inline-block; background:var(--azul); color:#fff; text-decoration:none;
    padding:11px 22px; border-radius:9px; font-weight:600; font-size:.95rem;
    border:0; cursor:pointer; font-family:inherit;
  }
  .btn:hover { background:var(--azul-osc); }
  .btn--fantasma { background:transparent; color:var(--azul); border:1px solid var(--filete); }
  .btn:disabled { background:#C9D2DB; cursor:not-allowed; }

  .candado { font-size:.88rem; color:var(--tenue); display:flex; gap:7px; align-items:center; }

  .campo { margin-bottom:12px; }
  .campo label { display:block; font-size:.84rem; font-weight:600; margin-bottom:5px; }
  .campo input {
    width:100%; padding:10px 12px; border:1px solid var(--filete); border-radius:9px;
    font-size:.98rem; font-family:inherit; background:#FBFCFD; color:var(--tinta);
  }
  .campo input:focus { outline:2px solid var(--azul); outline-offset:1px; border-color:var(--azul); }
  .dos { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px){ .dos{ grid-template-columns:1fr; } }

  .aviso { background:var(--rojo-luz); color:var(--rojo); border-radius:9px;
           padding:10px 14px; font-size:.9rem; margin-bottom:14px; }
  .nota { background:var(--ambar-luz); color:var(--ambar); border-radius:9px;
          padding:10px 14px; font-size:.88rem; }

  .compromiso {
    margin-top:30px; padding:22px; background:var(--papel);
    border:1px solid var(--filete); border-radius:14px;
  }
  .compromiso h3 { font-size:.96rem; margin:0 0 .6rem; }
  .compromiso ul { margin:0; padding-left:1.1rem; color:var(--suave); font-size:.93rem; }
  .compromiso li { margin-bottom:.38rem; }
  .pie { margin-top:28px; font-size:.82rem; color:var(--tenue); text-align:center; }

  /* El vídeo del paso de la academia. Proporción fija para que no salte el
     maquetado mientras carga el iframe. */
  .video { margin: 14px 0 16px; border-radius: 12px; overflow: hidden;
           background: #0B1017; aspect-ratio: 16 / 9; }
  .video iframe { width: 100%; height: 100%; border: 0; display: block; }

  .puerta { max-width: 420px; margin: 0 auto; text-align: center; padding-top: 6vh; }
  .puerta h1 { margin-bottom: 10px; }
  .puerta input {
    width: 100%; font: inherit; font-size: 1.35rem; font-weight: 600;
    letter-spacing: .22em; text-align: center; text-transform: uppercase;
    margin-top: 22px; padding: 16px 14px;
  }
  .puerta .btn { width: 100%; margin-top: 12px; }
</style>
</head>
<body>
<main class="envoltorio">
  <div class="puerta">
    <p class="sobretitulo">Free Agent Academy</p>
    <h1>Pon tu código</h1>
    <p class="entrada">Es el que te hemos pasado al confirmar tu plaza. Son ocho
    caracteres y no distingue mayúsculas.</p>

    {% if aviso %}<div class="aviso">{{ aviso }}</div>{% endif %}

    <form method="post" action="/empieza/entrar">
      <input name="codigo" maxlength="12" required autofocus autocomplete="one-time-code"
             spellcheck="false" aria-label="Tu código de acceso" placeholder="XXXXXXXX">
      <button class="btn" type="submit">Entrar</button>
    </form>

    <p class="nota" style="margin-top:22px">¿No lo encuentras? Escríbenos por
    WhatsApp y te lo volvemos a pasar.</p>
  </div>
</main>
</body>
</html>
